[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datasheet-hub"
version = "1.0.0"
description = "Modern EDA platform backend for component discovery, direct CDN datasheet resolution, and circuit synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ashsish Manchanda"}
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
datasheet-hub = "datasheet_hub.cli.main:main"
dhub = "datasheet_hub.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
