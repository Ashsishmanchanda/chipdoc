[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datasheet-cli"
version = "0.1.0"
description = "Automated pipeline converting component datasheets and reference designs to KiCad PCB schematics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "datasheet-cli contributors"}
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.23.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
datasheet-cli = "datasheet_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
